[gcode_macro LUBRICATE_AXES]
description: K1C XYZ lubrication and maintenance routine
gcode:
    {% set cycles = params.CYCLES|default(2)|int %}
    {% set speed = params.SPEED|default(12000)|float %}

    SAVE_GCODE_STATE NAME=LUBRICATE_STATE

    # Home only if necessary
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}

    G90

    # Starting position
    G1 X110 Y110 F{speed}
    G1 Z15 F900

    {% for i in range(cycles) %}

        RESPOND MSG="Lubrication cycle {i + 1} of {cycles}"

        # Full-width X sweeps
        G1 X0 Y15 F{speed}
        G1 X225 Y15 F{speed}
        G1 X0 Y110 F{speed}
        G1 X225 Y110 F{speed}
        G1 X0 Y223 F{speed}
        G1 X225 Y223 F{speed}

        # Full-length Y sweeps
        G1 X225 Y2 F{speed}
        G1 X110 Y223 F{speed}
        G1 X110 Y2 F{speed}
        G1 X0 Y223 F{speed}
        G1 X0 Y2 F{speed}

        # Diagonal movements
        G1 X225 Y223 F{speed}
        G1 X0 Y2 F{speed}
        G1 X225 Y2 F{speed}
        G1 X0 Y223 F{speed}

        # Short Z oscillations during XY movement
        G1 X225 Y223 Z35 F{speed}
        G1 X0 Y2 Z20 F{speed}
        G1 X225 Y2 Z45 F{speed}
        G1 X0 Y223 Z30 F{speed}

        # Full Z travel with smaller oscillations
        G1 X110 Y110 F{speed}
        G1 Z245 F900
        G1 Z180 F900
        G1 Z220 F900
        G1 Z140 F900
        G1 Z245 F900
        G1 Z180 F900
        G1 Z225 F900
        G1 Z15 F900

    {% endfor %}

    # Finish
    G1 X110 Y110 F{speed}
    G1 Z100 F900

    M400
    RESTORE_GCODE_STATE NAME=LUBRICATE_STATE

    RESPOND MSG="Lubrication routine complete"
